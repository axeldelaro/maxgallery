name: Build & Release Signed APK (HyperGallery AI)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Signed Release APKs (arm64-v8a & universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35 & Build-Tools 35.0.0
        run: |
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools" "$SDK_DIR/licenses"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdtools.zip"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"

          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$SDK_DIR/licenses/android-sdk-preview-license"

          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download Offline AI Models & Assemble Signed Release APKs
        run: ./gradlew downloadFaceModels assembleRelease --stacktrace

      - name: Audit Offline Privacy Guarantee (Zero INTERNET Permission)
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/release/HyperGallery-AI-arm64-v8a-release.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "FATAL: INTERNET permission detected in release APK!"
            exit 1
          fi
          echo "VERIFIED: Zero network permissions in final signed APK."
          ls -lh app/build/outputs/apk/release/HyperGallery-AI-*.apk

      - name: Upload Signed APKs as GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperGallery-AI-Signed-Release-APKs
          path: |
            app/build/outputs/apk/release/HyperGallery-AI-arm64-v8a-release.apk
            app/build/outputs/apk/release/HyperGallery-AI-universal-release.apk
          if-no-files-found: error

      - name: Publish / Update Public GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v2.0.0"
          fi

          NOTES="## HyperGallery AI v2.0.0 — Moteur Turbo Médias Masqués & IA Locale (100 % Hors-Ligne)

          - **Mode Exclusif Médias Masqués Uniquement** : Scanne et affiche exclusivement les médias cachés (\`.nomedia\`, dossiers/fichiers \`.point\`, et fichiers déguisés \`.bin/.dat/.tmp/.lock\` détectés par signature binaire Magic Bytes).
          - **Scan Parallèle Multi-Cœurs en 2 Phases** : Découverte instantanée sans blocage I/O + transactions batch SQLite Room WAL (600 entrées/transaction) + enrichissement EXIF/dHash asynchrone en tâche de fond.
          - **IA Locale Accélérée** : Indexation directe en mémoire sans latence WorkManager + BlazeFace pyramidal adaptatif (6× plus rapide) + MobileFaceNet 192-D + DBSCAN + Détecteur de doublons 64-bit \`dHash\`.
          - **Zéro permission Internet** (\`android.permission.INTERNET\` absente du manifeste final)."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              app/build/outputs/apk/release/HyperGallery-AI-arm64-v8a-release.apk \
              app/build/outputs/apk/release/HyperGallery-AI-universal-release.apk \
              --clobber
            gh release edit "$TAG_NAME" \
              --title "HyperGallery AI $TAG_NAME (Signed Production APK)" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG_NAME" \
              app/build/outputs/apk/release/HyperGallery-AI-arm64-v8a-release.apk \
              app/build/outputs/apk/release/HyperGallery-AI-universal-release.apk \
              --target "$GITHUB_SHA" \
              --title "HyperGallery AI $TAG_NAME (Signed Production APK)" \
              --notes "$NOTES" \
              --latest
          fi
